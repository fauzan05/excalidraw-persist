services:
  excalidraw:
    build:
      context: .
      dockerfile: Dockerfile
    image: cosl-excalidraw-persist:local
    ports:
      - '4002:80' # Web client - change first number if needed
      - '4001:4000' # Server API - matches original setup
    volumes:
      - data:/app/data
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DB_PATH=/app/data/database.sqlite
      - JWT_SECRET=${EXCALIDRAW_JWT_SECRET:-change-me-excalidraw-embed-jwt-secret-min-32}
      - SERVICE_API_KEY=${EXCALIDRAW_SERVICE_API_KEY:-change-me-excalidraw-service-api-key}
    restart: unless-stopped

volumes:
  data:
    driver: local
